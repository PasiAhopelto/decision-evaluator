spring.application.name=decision-evaluator

# H2 in-memory database, private to the application JVM (no TCP server, no web console)
spring.datasource.url=jdbc:h2:mem:decisions;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keep the web console off even if the console module is added back (devtools would enable it)
spring.h2.console.enabled=false

spring.thymeleaf.cache=false
